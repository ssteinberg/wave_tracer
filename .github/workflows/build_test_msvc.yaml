name: (Windows latest) Build and Test
on:
   push:
     tags:
       - "*"
     paths:
       - src/**
       - include/**
       - deps/**
       - CMakeLists.txt
       - .gitmodules
       - .github/workflows/build_test_msvc.yaml
     branches: [main, macos-port]
   workflow_dispatch:
permissions:
   contents: read

jobs:
  build_windows:
     name: Test build and compilation

     timeout-minutes: 240
     runs-on: windows-latest
     env:
       VCPKG_ROOT: "vcpkg"
       VCPKG_DISABLE_METRICS: "true"

     steps:
       - uses: actions/checkout@v4

       - uses: lukka/get-cmake@latest
       - name: Restore artifacts, setup vcpkg
         uses: lukka/run-vcpkg@v11

       - name: Update submodules
         shell: bash
         run: |
           git rm -r --cached scenes 2>/dev/null || true
           git submodule update --init --recursive

       - name: Configure
         run: |
           cmake -S . -B ./build -DCMAKE_BUILD_TYPE=Release
       - name: Build
         run: |
           cmake --build ./build --config Release

       - name: Test run
         run: |
           ./build/Release/wave_tracer.exe version 1>&2
